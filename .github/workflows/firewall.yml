# ⚠️ THIS REPO IS PUBLIC. That is the whole reason this gate exists here.
#
# The private-content firewall stops private content reaching a public surface.
# It was running on private repos, where publishing is impossible, and absent
# from the public ones, where publishing is the point (arqtos-sdk-go#38). A
# repo with no firewall is the silent-clean failure state with the middle step
# removed: the green check is already there and nothing is scanning.
name: firewall

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files against denylist
        # ⚠️ SHA-pinned, unlike the other shared actions here which use @v1, and
        # the baseline manifest requires it: this is the only shared action that
        # is a GATE. A compromised gate does not break the build — it returns a
        # GREEN CHECK on a repo whose scan is no longer running. Bump
        # deliberately, reading the diff.
        #
        # ⚠️ BUMPED FROM e294a60d, AND THE BUMP IS REQUIRED, NOT COSMETIC. That
        # pin predates the `.firewallignore` exemptions mechanism entirely
        # (arqtiqa/arqtos#341), and the probe corpus this repo now carries is a
        # file of denylist-shaped strings that the gate matches BY
        # CONSTRUCTION — without exemptions there is no way to hold the gate
        # green over it except by weakening the denylist or by a silent
        # exclusion, and a silent exclusion is the defect class arqtos#343 was
        # filed for.
        #
        # ⚠️ AND IT NAMES v1's COMMIT, SO THIS GATE RUNS THE SAME SCANNER BUILD
        # THE FALSIFIER BELOW DOES. The falsifier drives the scanner sitting
        # BESIDE IT, at its own ref — and its ref is `@v1`, not a SHA (only the
        # firewall may be SHA-pinned; see arqtos-actions' ci-baseline.yml for
        # that rule and for the refused proposal to widen it). Pinning this at
        # v1's own commit makes the two agree exactly rather than merely
        # probably.
        #
        # ⚠️ Nothing enforces that agreement — it is the standing cost of the
        # moving tag. If `v1` later moves to a commit carrying a different
        # scanner, the falsifier would prove this list alive under one engine
        # while this gate ran another. Re-check this line whenever `v1` moves.
        #
        # Verified on this repository's real tree at this SHA: exit 0, 11
        # patterns, 11 file/rule pairs exempted.
        #
        # The bump carries arqtos#341 (exemptions), #343 (a same-basename file
        # must also be byte-identical before the vendored-denylist skip drops
        # it), #348 (an input description no longer evaluates as a template
        # expression, which had made this action unloadable for every consumer)
        # and #365 (an exemption may name an identity-overlay rule by handle;
        # inert here, this repo wires no overlay).
        uses: arqtiqa/arqtos-actions/.github/actions/firewall@dc1f8ad663357a54898ae416f21689db2d45537a  # arqtos#341 exemptions + #343 basename-skip + #348 loadable + #365 overlay exemptions
        with:
          # ⚠️ The denylist lives HERE and is passed in; the action ships none,
          # so a missing one is exit 2 (misconfigured) rather than a silent pass.
          # The list is the estate's public subset — generic credential shapes
          # and private-network ranges, no identity patterns.
          denylist: .github/scripts/private-content-denylist.txt

      # ⚠️ THE STEP ABOVE BEING GREEN IS NOT EVIDENCE THE DENYLIST STILL BITES
      # (arqtiqa/arqtos#361).
      #
      # Until now this repository's list rested on a ONE-TIME MANUAL DRY-RUN
      # performed on the day the gate was enabled — evidence it bit once, on one
      # day, against one tree. Nothing re-ran it, and every way a denylist
      # decays leaves the gate GREEN: a rule edited into a form that still
      # COMPILES but matches nothing (arqtos-cli#1092 was exactly that one level
      # down — the shared script reported CLEAN when `grep` REJECTED a pattern),
      # a rule deleted during an unrelated edit, a rule added with nothing
      # behind it. A green firewall over a dead denylist is worse than no
      # firewall, because it is trusted — and this repository is PUBLIC, which
      # is where that costs the most.
      #
      # The corpus it reads (`.firewall-probes`) is a file of SYNTHETIC strings
      # engineered to fire this repo's list — shaped LIKE a credential, never an
      # instance of one. See both files' own headers.
      - name: Prove every denylist rule still bites
        uses: arqtiqa/arqtos-actions/.github/actions/firewall-falsifier@v1  # arqtos#361
        with:
          # ⚠️ THE SAME list the gate above scans. Proving a different list
          # alive is the most convincing possible form of no coverage.
          denylist: .github/scripts/private-content-denylist.txt
